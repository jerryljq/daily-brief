<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>世界新闻摘要</title>
<style>
  :root{
    --paper:#FBF9F4; --paper-edge:#F1EEE5; --ink:#20201D; --ink-soft:#55534C;
    --ink-muted:#8C8A80; --rule:#D8D4C8; --rule-hair:#E8E5DB; --rule-heavy:#20201D;
    --link:#1B4F8A; --mark:#FBF0C4; --red:#A81C16;
    --hol-cn:#8F6200; --hol-ca:#B32820; --hol-us:#17539B;
    --sp-tint:rgba(168,28,22,.045);
    --cn:#9B2C24; --us:#1B4F8A; --gl:#1F6B54; --ec:#8A5A12; --lo:#8C3A63; --jk:#4A4590;
    --shadow:0 1px 2px rgba(28,26,20,.05), 0 12px 32px -12px rgba(28,26,20,.18);
    /* 报头：魏碑打头，退到隶书类，再退到宋体。Android 基本没有书法体，兜到 serif */
    --display:"Weibei SC","STWeibeiSC","Baoli SC","STBaoliSC","STLiti","华文隶书",
      "LiSu","隶书","Songti SC","SimSun",serif;
    /* 楷体：只用在引文、特刊、副刊——报纸的惯例位置。整篇正文用楷体在屏幕上会发灰 */
    --kai:"Kaiti SC","STKaiti","KaiTi","楷体","BiauKai","TW-Kai","Songti SC","SimSun",serif;
    /* 标题：宋体，与楷体正文形成对比 */
    --serif:"Songti SC","SimSun",Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  }
  :root[data-theme="night"]{
    --paper:#191917; --paper-edge:#121211; --ink:#E9E6DD; --ink-soft:#B0ADA3;
    --ink-muted:#7C7A72; --rule:#37362F; --rule-hair:#2A2925; --rule-heavy:#6E6B61;
    --link:#7FB3E8; --mark:#3D3617; --red:#E4695C;
      --hol-cn:#E0B341; --hol-ca:#E8887C; --hol-us:#7FB3E8;
      --sp-tint:rgba(228,105,92,.075);
    --cn:#E07268; --us:#7FB3E8; --gl:#5FC49F; --ec:#D9A340; --lo:#DE8AB4; --jk:#A29CE8;
    --shadow:0 0 0 1px rgba(255,255,255,.04);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="day"]){
      --paper:#191917; --paper-edge:#121211; --ink:#E9E6DD; --ink-soft:#B0ADA3;
      --ink-muted:#7C7A72; --rule:#37362F; --rule-hair:#2A2925; --rule-heavy:#6E6B61;
      --link:#7FB3E8; --mark:#3D3617; --red:#E4695C;
      --hol-cn:#E0B341; --hol-ca:#E8887C; --hol-us:#7FB3E8;
      --sp-tint:rgba(228,105,92,.075);
      --cn:#E07268; --us:#7FB3E8; --gl:#5FC49F; --ec:#D9A340; --lo:#DE8AB4; --jk:#A29CE8;
      --shadow:0 0 0 1px rgba(255,255,255,.04);
    }
  }

  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; background:var(--paper-edge); color:var(--ink);
    font-family:var(--sans); line-height:1.6;
    display:flex; justify-content:center; padding:28px 14px 56px;
  }

  /* ── 阅读进度：贴在窗口顶端的一条细线 ── */
  #progress{position:fixed; top:0; left:0; height:2px; width:0;
    background:var(--ink); opacity:.55; z-index:50; transition:width .1s linear;}

  .paper{width:100%; max-width:760px; background:var(--paper);
    box-shadow:var(--shadow); border:1px solid var(--rule);}

  /* ── 报头 ── */
  .masthead{padding:20px 26px 0; text-align:center;}
  .folio{display:flex; justify-content:space-between; align-items:baseline;
    font-size:10.5px; letter-spacing:.14em; color:var(--ink-muted);
    font-variant-numeric:tabular-nums;
    padding-bottom:11px; margin-bottom:17px; border-bottom:1px solid var(--rule-hair);}
  .folio span{white-space:nowrap;}
  .folio b{color:var(--ink-soft); font-weight:600;}
  /* 报名两侧引出细红线，中文报头的老做法 */
  .mast-line{display:flex; align-items:center; gap:clamp(10px,4vw,28px);}
  .mast-rule{flex:1 1 0; min-width:14px; height:1px; background:var(--red); opacity:.45;}
  .wordmark{font-family:var(--display); font-size:clamp(30px,9vw,54px); font-weight:700;
    letter-spacing:.14em; margin:0; line-height:1.2; text-indent:.14em;
    color:var(--red); white-space:nowrap;}
  .mast-en{font-family:var(--sans); font-size:9.5px; letter-spacing:.4em;
    color:var(--red); opacity:.7; margin:11px 0 0; text-indent:.4em;}
  .subtitle{font-family:var(--serif); font-size:11.5px; letter-spacing:.3em;
    color:var(--ink-soft); margin:8px 0 0; text-indent:.3em;}
  .rule-double{margin:17px 0 0; border-top:3px solid var(--red);}
  .rule-double::after{content:""; display:block; margin-top:2px;
    border-top:1px solid var(--rule-heavy);}

  /* ── 假期带 ── */
  .holiday-bar{display:flex; flex-wrap:wrap; justify-content:center;
    border-bottom:1px solid var(--rule); font-size:10.5px; letter-spacing:.06em;
    color:var(--ink-muted);}
  .hol{display:flex; align-items:baseline; gap:6px; padding:7px 15px;
    border-right:1px solid var(--rule-hair);}
  .hol:last-child{border-right:none;}
  .hol-cn{--hol:var(--hol-cn);}
  .hol-ca{--hol:var(--hol-ca);}
  .hol-us{--hol:var(--hol-us);}
  .hol b{color:var(--hol,var(--ink-soft)); font-weight:600; letter-spacing:.1em;}
  .hol-name{color:var(--hol,inherit);}
  .hol i{font-style:normal; font-variant-numeric:tabular-nums; color:var(--ink-soft);}
  .hol em{font-style:normal; opacity:.72;}
  .hol-scope{border:1px solid currentColor; color:var(--hol,var(--ink-muted)); opacity:.72;
    padding:0 4px; font-size:9px; letter-spacing:.04em;}

  /* ── 索引条 ── */
  .indexbar{display:flex; flex-wrap:wrap; align-items:center; gap:2px;
    padding:9px 26px; border-bottom:1px solid var(--rule); font-size:11px;
    position:sticky; top:0; z-index:40; background:var(--paper);}
  .indexbar.stuck{box-shadow:0 6px 14px -10px rgba(0,0,0,.45);}
  .indexbar.stuck .lbl{display:none;}
  .indexbar .lbl{font-family:var(--serif); letter-spacing:.2em;
    color:var(--ink-muted); margin-right:8px;}
  .jump{background:none; border:0; padding:3px 7px; cursor:pointer;
    font:inherit; color:var(--ink-soft); border-bottom:2px solid transparent;}
  .jump:hover{color:var(--ink); border-bottom-color:currentColor;}
  .jump[hidden]{display:none;}
  .tools{margin-left:auto; display:flex; gap:2px;}
  .tool{background:none; border:1px solid var(--rule); padding:3px 9px;
    cursor:pointer; font:inherit; font-size:10.5px; color:var(--ink-soft);}
  .tool:hover{border-color:var(--ink-muted); color:var(--ink);}

  /* ── 三栏 ── */
  .cols{display:grid; grid-template-columns:repeat(3,1fr);}
  .col{padding:16px 18px 18px; border-right:1px solid var(--rule-hair);}
  .col:last-child{border-right:none;}
  .sechead{font-family:var(--serif); font-size:16px; font-weight:700;
    letter-spacing:.08em; color:var(--accent,var(--ink));
    padding-bottom:7px; margin-bottom:2px;
    border-bottom:2px solid currentColor;}
  .sechead .en{font-family:var(--sans); font-size:9px; letter-spacing:.2em;
    color:var(--ink-muted); display:block; margin-top:3px; font-weight:400;}

  /* ── 条目 ── */
  details.item{border-bottom:1px solid var(--rule-hair);}
  details.item:last-child{border-bottom:none;}
  details.item > summary{list-style:none; cursor:pointer; padding:9px 0 8px;
    display:flex; gap:8px; align-items:flex-start;}
  details.item > summary::-webkit-details-marker{display:none;}
  details.item > summary:focus-visible{outline:2px solid var(--link); outline-offset:2px;}
  .hl{font-family:var(--serif); font-size:14px; font-weight:600; line-height:1.45;
    flex:1; letter-spacing:.01em;}
  .hl a{color:inherit; text-decoration:none;}
  .hl a:hover{text-decoration:underline; text-underline-offset:2px;}
  .chev{flex-shrink:0; width:9px; height:9px; margin-top:6px; border-right:1.5px solid var(--ink-muted);
    border-bottom:1.5px solid var(--ink-muted); transform:rotate(45deg);
    transition:transform .2s ease;}
  details.item[open] > summary .chev{transform:rotate(-135deg);}
  .body{font-family:var(--serif); font-size:12.5px; color:var(--ink-soft); line-height:1.85;
    padding:0 0 11px; text-align:justify;}
  /* 副刊（趣闻/笑话）用楷体：报纸副刊的传统做法，也把软内容和硬新闻分开 */
  .duo .body{font-family:var(--kai); font-size:13.5px; line-height:1.95;}
  .body a{color:var(--link);}
  /* 首字下沉只给“本期两个重点”：头条 + 特刊。
     每条都加的话，28 条里有 28 个下沉，三栏窄栏里一个 2.9em 的汉字要吃掉三行。 */
  details.item.dropcap[open] .body::first-letter,
  .special-body > p:first-of-type::first-letter{
    font-family:var(--serif); font-size:2.9em; font-weight:700; float:left;
    line-height:.86; padding:2px 7px 0 0; color:var(--ink);}
  details.special.pending .special-body > p:first-of-type::first-letter{
    font-size:inherit; float:none; padding:0; font-weight:inherit;}
  .tag-fiction{display:inline-block; font-family:var(--sans); font-size:9.5px;
    letter-spacing:.1em; border:1px solid currentColor; color:var(--lo);
    padding:0 5px; margin-left:7px; vertical-align:2px; white-space:nowrap;}
  .empty{font-size:11.5px; color:var(--ink-muted); padding:10px 0; font-style:italic;}

  /* ── 通栏板块 ── */
  .band{padding:16px 26px 18px; border-top:1px solid var(--rule);}
  .band .sechead{margin-bottom:4px;}
  .band .items{column-gap:26px;}
  @media (min-width:641px){
    .band .items{columns:2; column-rule:1px solid var(--rule-hair);}
    .band details.item{break-inside:avoid;}
  }

  /* ── 特刊 ── */
  details.special{border-top:3px solid var(--red); background:var(--sp-tint);}
  details.special.pending{border-top:1px solid var(--rule); background:none;}
  details.special > summary{list-style:none; cursor:pointer; padding:12px 26px;
    display:flex; align-items:center; gap:10px;}
  details.special > summary::-webkit-details-marker{display:none;}
  .kicker{font-size:9.5px; letter-spacing:.2em; padding:2px 9px; flex-shrink:0;
    background:var(--red); color:var(--paper); font-weight:600; border:1px solid var(--red);}
  details.special.pending .kicker{background:none; border-color:var(--rule); color:var(--ink-muted); font-weight:400;}
  .special-title{font-family:var(--serif); font-size:16px; font-weight:700; flex:1;
    color:var(--red); letter-spacing:.02em;}
  details.special.pending .special-title{color:var(--ink-soft); font-size:15px;}
  .special-body{font-family:var(--kai); padding:0 26px 20px; font-size:14.5px;
    line-height:2.05; color:var(--ink);}
  .special-body h4{font-family:var(--serif); font-size:14px; margin:18px 0 6px;
    padding-bottom:4px; border-bottom:1px solid var(--rule-hair);}
  .special-body h4:first-child{margin-top:0;}
  .pending-note{margin:0; color:var(--ink-muted);}
  .special-body p{margin:0 0 10px;}
  .special-body a{color:var(--link);}

  /* ── 趣闻 / 笑话 ── */
  .duo{display:grid; grid-template-columns:1.25fr 1fr; border-top:1px solid var(--rule);}
  .duo .col{border-right:1px solid var(--rule-hair);}
  .duo .col:last-child{border-right:none;}

  /* ── 报尾 ── */
  .colophon{border-top:3px double var(--rule-heavy); padding:20px 26px 22px; text-align:center;}
  .poem{max-width:540px; margin:0 auto;}
  .poem-head{font-family:var(--serif); margin-bottom:11px;}
  .poem-title{font-size:16.5px; font-weight:700; letter-spacing:.08em;}
  .poem-title::before{content:"【";} .poem-title::after{content:"】";}
  .poem-by{font-size:12px; color:var(--ink-muted); margin-left:8px; letter-spacing:.08em;}
  .poem-lines{font-family:var(--kai); font-size:16px; line-height:2.15; letter-spacing:.06em;}
  .poem-note{font-family:var(--kai); font-size:13px; color:var(--ink-soft);
    line-height:1.95; margin:14px 0 0; text-align:justify;
    padding-top:12px; border-top:1px solid var(--rule-hair);}
  .quote{font-family:var(--kai); font-size:15px; font-style:normal;
    color:var(--ink-soft); margin:0; line-height:1.8;}
  .imprint{font-size:10px; letter-spacing:.18em; color:var(--ink-muted);
    margin:14px 0 0; text-transform:uppercase;}

  /* ── 响应式 ── */
  @media (max-width:640px){
    body{padding:0;}
    .paper{border:none; box-shadow:none;}
    .masthead{padding:18px 16px 0;}
    .folio{flex-direction:column; align-items:center; gap:3px; font-size:10px;}
    .subtitle{font-size:10.5px; letter-spacing:.2em; text-indent:.2em;}
    .mast-line{gap:9px;}
    .mast-rule{min-width:8px;}
    .mast-en{font-size:8.5px; letter-spacing:.28em; text-indent:.28em;}
    .holiday-bar{flex-direction:column;}
    .hol{border-right:none; border-bottom:1px solid var(--rule-hair);
      justify-content:center; padding:6px 12px;}
    .hol:last-child{border-bottom:none;}
    .indexbar{padding:8px 12px; gap:1px;}
    .indexbar .lbl{width:100%; margin:0 0 4px;}
    .tools{margin-left:0; width:100%; margin-top:6px;}
    .cols,.duo{grid-template-columns:1fr;}
    .col{border-right:none; border-bottom:1px solid var(--rule); padding:14px 16px 16px;}
    .cols .col:last-child,.duo .col:last-child{border-bottom:none;}
    .band{padding:14px 16px 16px;}
    details.special > summary,.special-body{padding-left:16px; padding-right:16px;}
    .colophon{padding:18px 16px 20px;}
    .body{text-align:left;}
  }

  /* ── 打印 ── */
  @media print{
    body{background:#fff; padding:0;}
    .paper{max-width:none; border:none; box-shadow:none;}
    .indexbar,#progress,.chev{display:none !important;}
    details.item > summary{cursor:default;}
    .body{display:block !important;}
    a{color:inherit; text-decoration:none;}
    .body a[href]::after{content:" (" attr(href) ")"; font-size:9px; color:#666;}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>
</head>
<body>
<div id="progress"></div>

<div class="paper">
  <header class="masthead">
    <div class="folio">
      <span>总第 <b id="issue-no">--</b> 期</span>
      <span id="date-line"></span>
      <span>今日 <b id="ban-count">1</b> 版</span>
    </div>
    <div class="mast-line">
      <span class="mast-rule"></span>
      <h1 class="wordmark">世界新闻摘要</h1>
      <span class="mast-rule"></span>
    </div>
    <p class="mast-en">WORLD NEWS DIGEST</p>
    <p class="subtitle">环球要闻 · 每日一览</p>
    <div class="rule-double"></div>
  </header>

  <div class="holiday-bar" id="holiday-bar" hidden></div>

  <nav class="indexbar">
    <span class="lbl">本期索引</span>
    <button class="jump" data-target="sec-china" hidden>中国</button>
    <button class="jump" data-target="sec-us_ca" hidden>美加</button>
    <button class="jump" data-target="sec-global" hidden>全球</button>
    <button class="jump" data-target="economy-section" hidden>经济</button>
    <button class="jump" data-target="special-section" hidden>特刊</button>
    <button class="jump" data-target="sec-local" hidden>趣闻</button>
    <button class="jump" data-target="sec-jokes" hidden>笑话</button>
    <span class="tools">
      <button class="tool" id="toggle-all">展开全部</button>
      <button class="tool" id="toggle-theme">夜间</button>
      <button class="tool" id="do-print">打印</button>
    </span>
  </nav>

  <main>
    <div class="cols" id="cols-section"></div>
    <section class="band" id="economy-section" hidden></section>
    <details class="special" id="special-section" hidden>
      <summary>
        <span class="kicker" id="special-kicker">特刊</span>
        <span class="special-title" id="special-title"></span>
        <span class="chev"></span>
      </summary>
      <div class="special-body" id="special-body"></div>
    </details>
    <div class="duo">
      <div class="col" id="sec-local" style="--accent:var(--lo)">
        <div class="sechead">本地趣闻<span class="en">LOCAL</span></div>
        <div id="local-fun-section"></div>
      </div>
      <div class="col" id="sec-jokes" style="--accent:var(--jk)">
        <div class="sechead">今日一笑<span class="en">LAUGH</span></div>
        <div id="jokes-section"></div>
      </div>
    </div>
  </main>

  <footer class="colophon">
    <div class="poem" id="poem-block" hidden>
      <div class="poem-head">
        <span class="poem-title" id="poem-title"></span><span class="poem-by" id="poem-by"></span>
      </div>
      <div class="poem-lines" id="poem-lines"></div>
      <p class="poem-note" id="poem-note"></p>
    </div>
    <p class="quote" id="quote-line"></p>
    <p class="imprint">世界新闻摘要 · 每日出版</p>
  </footer>
</div>

  "poem": {
    "title": "出师表（节选）",
    "author": "诸葛亮",
    "dynasty": "三国·蜀汉",
    "lines": [

      "先帝不以臣卑鄙，猥自枉屈，三顾臣于草庐之中，咨臣以当世之事，由是感激，遂许先帝以驱驰。"
    ],
    "note": "《出师表》作于蜀汉建兴五年（227年），诸葛亮率军北驻汉中、准备北伐曹魏之前，上书后主刘禅。此时刘备已逝世四年，蜀汉偏安一隅，国力弱小，诸葛亮既要谋划出征，又放心不下年轻的君主，于是以这篇奏表“临表涕零，不知所言”。所选一段是他自述身世：本是隐居南阳的布衣，只求在乱世保全性命，并不想在诸侯间扬名；刘备不嫌他出身微贱，亲自屈尊三次到草庐拜访，询问天下大事，他因此感激，答应为先帝奔走效力。全文不用华丽辞藻，却句句出于真情，既有忠臣的恳切，又有长者般的叮嘱。后人评价“读《出师表》不下泪者，其人必不忠”。它值得一读，在于让我们看见权力与责任背后的人：一个明知前路艰难的人，如何用最朴素的话交代自己为何坚持。在今天这个重要选择扎堆的周末读它，也许会想起：被信任，往往比被赞美更沉重。"
  },
  "special": {
    "title": "本周回顾与下周展望",
    "html": "<p>覆盖 10 月 26 日至 10 月 31 日（上一期周回顾为 10 月 25 日）。主线与“被低估的一条”均来自本仓库本周日报已报道的条目，链接为当时的原文链接；下周日程部分为本次检索确认，来源见文末。</p>\n\n<h4>一、本周主线</h4>\n\n<p><b>1. 伊朗战事：一边备战，一边递橄榄枝，海峡里继续出事。</b></p>\n<ul>\n<li>10 月 27 日：半岛电视台分析称，美以与伊朗的战事已持续约八个月，伊朗坚持解除制裁、结束美国海上封锁并要求不再遭袭；袭击油轮已把布伦特原油推高至 117 美元以上。<a href=\"https://www.aljazeera.com/news/2026/10/27/irans-calculations-as-us-escalation-looms-trust-midterms-hormuz\" target=\"_blank\">原文</a></li>\n<li>10 月 29 日：伊朗革命卫队海军称，三艘油轮在试图离开“未经授权的南线航道”时触水雷起火；伊朗称外交仍有可能。<a href=\"https://www.aljazeera.com/news/liveblog/2026/10/29/iran-war-live-tehran-presses-7-day-hormuz-plan-trump-denies-peace-talks\" target=\"_blank\">原文</a></li>\n<li>10 月 30 日：美国在权衡新一轮对伊打击的同时，副总统万斯提出愿与伊朗的穆赫辛·礼萨伊面谈；分析人士称互不信任是最大障碍。<a href=\"https://www.aljazeera.com/news/2026/10/30/us-weighs-new-iran-strikes-as-vance-reaches-out-is-war-or-a-deal-closer\" target=\"_blank\">原文</a></li>\n<li>10 月 31 日：特朗普称冲突将“很快结束”，伊朗代表团前往多哈。<a href=\"https://www.aljazeera.com/news/liveblog/2026/10/31/iran-war-live-oil-tankers-hit-in-hormuz-trump-says-conflict-will-end-soon\" target=\"_blank\">原文</a></li>\n</ul>\n<p>现在到哪一步：军事升级的选项和谈判渠道同时开着，两边的表态互相矛盾，尚无任何已确认的协议。能源价格是这条线向市场传导的通道（见第 2 条）。</p>\n\n<p><b>2. 市场：AI 投入的回报被重新审视，能源股逆势。</b></p>\n<ul>\n<li>10 月 26 日：Meta 拟融资最高约 950 亿美元支持 AI 投入。<a href=\"https://finance.sina.com.cn/stock/usstock/c/2026-10-26/doc-iniwqarr5399045.shtml\" target=\"_blank\">原文</a>同日，Anthropic 递交 IPO 招股书的报道见当天日报；10 月 27 日的报道称其上半年营收约 163 亿美元、净亏损 807 亿美元。<a href=\"https://www.aljazeera.com/economy/2026/10/28/global-stock-markets-rise-as-investors-continue-to-bet-on-ai\" target=\"_blank\">原文</a></li>\n<li>10 月 27 日：美国企业发债达 1.76 万亿美元历史新高（据网易转载标题）。<a href=\"https://www.163.com/dy/article/LA9A5JQS0519DTSV.html\" target=\"_blank\">原文</a></li>\n<li>10 月 30 日：CNN 称大型科技股财报引发对 AI 开支回报的担忧，英特尔盘前重挫约 25%。<a href=\"https://edition.cnn.com/2026/10/30/investing/us-stocks-ai-investment\" target=\"_blank\">原文</a></li>\n<li>10 月 31 日日报：10 月 30 日纳指跌 2.86%，创 6 月以来最差单日；雪佛龙、埃克森美孚股价创历史新高。<a href=\"https://www.cnbc.com/2026/10/29/stock-market-today-live-updates.html\" target=\"_blank\">原文</a></li>\n</ul>\n<p>现在到哪一步：周初还是“AI 押注上扬”（10 月 28 日全球股市上涨），周末已变成科技股集中抛售与能源股走强并存。</p>\n\n<p><b>3. 中期选举进入最后一周：法庭、黑客与“同名候选人”。</b></p>\n<ul>\n<li>加州选票之争：10 月 27 日联邦上诉法院以 2 比 1 驳回特朗普政府阻止加州清点约 2 万张“疑似非公民”选票的请求<a href=\"https://www.aljazeera.com/news/2026/10/27/us-court-rules-against-trump-administration-in-california-voting-case\" target=\"_blank\">原文</a>；10 月 29 日联邦法官卡特同样驳回，司法部随即上诉至第九巡回法院。<a href=\"https://www.aljazeera.com/news/2026/10/29/judge-rejects-trump-effort-to-block-california-noncitizen-ballots\" target=\"_blank\">原文</a></li>\n<li>10 月 28 日：黑客攻击联邦选举委员会网站，迫使其暂停网络服务；委员称选民档案由各州维护，未受影响。<a href=\"https://www.aljazeera.com/news/2026/10/28/hackers-target-us-campaign-finance-system-days-before-midterm-elections\" target=\"_blank\">原文</a></li>\n<li>10 月 31 日：民主党要在参议院夺回多数需净增 4 席，共和党目前 53 比 47；半岛电视台列出 10 个关键战场。<a href=\"https://www.aljazeera.com/news/2026/10/31/can-democrats-win-the-us-senate-10-key-midterm-races-to-watch\" target=\"_blank\">原文</a>阿拉斯加选票上出现两个“丹·沙利文”，涉及民主党挑战者助手是否帮忙招募的指称，当事人否认。<a href=\"https://www.aljazeera.com/news/2026/10/31/alaskas-two-dan-sullivans-how-common-is-ballot-stacking-does-it-work\" target=\"_blank\">原文</a></li>\n<li>10 月 30 日：CNBC 称华尔街正为民主党夺回国会席位做准备。<a href=\"https://www.cnbc.com/2026/10/30/2026-midterm-election-wall-street-prepares-for-democratic-gains.html\" target=\"_blank\">原文</a></li>\n</ul>\n<p>现在到哪一步：关于选票的法律争议在选前基本被法院挡回，但案件仍在审理；选举日是 11 月 3 日。</p>\n\n<p><b>4. 央行分化：美联储按兵不动，加拿大三年来首次加息，日本央行也不动。</b></p>\n<ul>\n<li>10 月 28 日：美联储将利率维持在 3.75%–4%，主席沃什承认近六年通胀都高于目标。<a href=\"https://news.sina.com.cn/w/2026-10-29/doc-iniwwawy6133245.shtml\" target=\"_blank\">原文</a></li>\n<li>同日加拿大央行加息，结束近三年的暂停。<a href=\"https://www.aljazeera.com/economy/2026/10/28/bank-of-canada-raises-interest-rates-for-the-first-time-in-three-years\" target=\"_blank\">原文</a></li>\n<li>10 月 30 日：日本央行维持利率 1.25%，8 比 1 表决（高田创主张加息至 1.5%），16 位经济学家全部预期 12 月或 1 月加息（据 CNBC 调查）。<a href=\"https://www.cnbc.com/2026/10/30/boj-inflation-target-rates.html\" target=\"_blank\">原文</a></li>\n</ul>\n<p>现在到哪一步：高油价把通胀问题重新推到各国央行面前，各家反应不一。</p>\n\n<h4>二、被低估的一条：也门战事重燃</h4>\n<p>它在每天的日报里都只占一两行，但一周内的三条记录串起来有分量：10 月 26 日，沙特领衔联军空袭胡塞导弹设施，胡塞称袭击利雅得机场并以无人机袭击沙特输油站，沙方称拦截了一枚导弹<a href=\"https://www.aljazeera.com/news/2026/10/26/saudi-led-coalition-says-it-struck-houthi-missile-facilities\" target=\"_blank\">原文</a>；10 月 28 日布伦特升破 116 美元的报道中提到沙特与胡塞对峙是推手之一<a href=\"https://www.aljazeera.com/economy/2026/10/28/global-stock-markets-rise-as-investors-continue-to-bet-on-ai\" target=\"_blank\">原文</a>；10 月 31 日联合国称自 8 月战事重启以来至少 29 万人流离失所，胡塞的导弹射向亚丁总统府和机场。<a href=\"https://www.aljazeera.com/news/2026/10/31/new-yemen-fighting-displaces-290000-says-un-with-pregnant-women-at-risk\" target=\"_blank\">原文</a></p>\n<p>为什么值得盯：霍尔木兹之外，红海一侧的沙特设施也在被打；一旦这条线继续升级，对油价的冲击不再只取决于美伊谈判。这是我的判断，不是报道结论。</p>\n\n<h4>三、下周展望</h4>\n<p><b>已确认的日程</b>（美国数据日程据 <a href=\"https://www.simianx.ai/stories/us-economic-calendar-this-month-in-your-time-zone\" target=\"_blank\">simianx.ai 的 11 月美国市场日历页</a>，为聚合站，具体时点请以官方发布为准；时间为美东时间）：</p>\n<ul>\n<li>11 月 2 日（周一）：美国 ISM 制造业 PMI（10 月）；苹果财报，盘后。美国夏令时 11 月 1 日结束。</li>\n<li>11 月 2 日起：中国央行以 1.25% 的隔夜逆回购作为主要政策利率，取代 7 天期逆回购（1.40%）；利率水平未变，不宜简单视为降息。<a href=\"https://finance.sina.com.cn/stock/zqgd/2026-10-30/doc-iniwziir8135300.shtml\" target=\"_blank\">原文</a></li>\n<li>11 月 3 日（周二）：美国中期选举；JOLTS 职位空缺（9 月）。</li>\n<li>11 月 4 日（周三）：财政部季度再融资公告；ISM 服务业 PMI。</li>\n<li>11 月 6 日（周五）：10 月非农就业与失业率；密歇根大学消费者信心初值。</li>\n<li>下一轮：11 月 10 日 CPI（10 月数据）、11 月 13 日 PPI；该日历页称下周窗口内没有 FOMC 利率决议，10 月会议纪要在 11 月 18 日。</li>\n<li>Anthropic IPO：10 月 26 日的报道称有望在 11 月 3 日之后、感恩节之前上市，募资规模与代码尚未披露。<a href=\"https://finance.sina.com.cn/stock/usstock/c/2026-10-26/doc-iniwqhxm9227041.shtml\" target=\"_blank\">原文</a></li>\n</ul>\n\n<p><b>本周遗留的悬念</b>：</p>\n<ul>\n<li>伊朗：选举日之后是否出现新一轮打击，或谈判在多哈等渠道取得进展，目前没有已确认的日期。</li>\n<li>以色列：中央选举委员会已于 10 月 30 日公布最终结果，内塔尼亚胡阵营 53 席、埃森科特领导的反对派 48 席、阿拉伯裔政党 19 席，均不足 61 席。按半岛电视台说明的程序，以色列总统赫尔佐格可指定最有机会组阁的人选，对方约有 28 天（可延长）；报道没有给出具体的指定日期。<a href=\"https://www.aljazeera.com/news/2026/10/30/how-can-israel-break-its-election-deadlock\" target=\"_blank\">原文</a></li>\n<li>加州选票案：司法部已上诉至第九巡回法院，是否有裁决要看选举日前后的进展。</li>\n</ul>\n",
    "status": "ready"
  },

<script>
(function(){
  var raw = document.getElementById('brief-data').textContent.trim();
  var data;
  try { data = JSON.parse(raw); }
  catch(e){ document.querySelector('main').innerHTML =
    '<p class="empty" style="padding:40px 26px;text-align:center;">数据加载失败</p>'; return; }

  function esc(s){
    var d = document.createElement('div');
    d.textContent = (s === undefined || s === null) ? '' : String(s);
    return d.innerHTML;
  }

  function item(it, i, opts){
    opts = opts || {};
    var open = (opts.firstOpen && i === 0) ? ' open' : '';
    var lead = (opts.dropcap && i === 0) ? ' dropcap' : '';
    var title = it.url
      ? '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">' + esc(it.title) + '</a>'
      : esc(it.title);
    var tag = it.fictional ? '<span class="tag-fiction">虚构</span>' : '';
    var src = it.url
      ? ' <a href="' + esc(it.url) + '" target="_blank" rel="noopener">原文 &rsaquo;</a>' : '';
    return '<details class="item' + lead + '"' + open + '>' +
      '<summary><span class="hl">' + title + tag + '</span><i class="chev"></i></summary>' +
      '<div class="body">' + esc(it.summary || '') + src + '</div></details>';
  }

  function list(arr, opts){
    if(!arr || !arr.length) return '<div class="empty">今日暂无</div>';
    return arr.map(function(it, i){ return item(it, i, opts); }).join('');
  }

  var sec = data.sections || {}, ban = 0;

  // 三栏
  var defs = [
    {k:'china',  zh:'中国热点', en:'CHINA',  v:'--cn'},
    {k:'us_ca',  zh:'美加热点', en:'US · CA', v:'--us'},
    {k:'global', zh:'全球热点', en:'WORLD',  v:'--gl'}
  ];
  document.getElementById('cols-section').innerHTML = defs.map(function(c){
    var arr = sec[c.k] || [];
    if(arr.length) ban++;
    return '<div class="col" id="sec-' + c.k + '" style="--accent:var(' + c.v + ')">' +
      '<div class="sechead">' + c.zh + '<span class="en">' + c.en + '</span></div>' +
      list(arr, {firstOpen:true, dropcap:c.k === 'china'}) + '</div>';
  }).join('');

  // 经济
  var econ = sec.economy || [];
  if(econ.length){
    ban++;
    var el = document.getElementById('economy-section');
    el.hidden = false;
    el.style.setProperty('--accent', 'var(--ec)');
    el.innerHTML = '<div class="sechead">经济 · 市场<span class="en">MARKETS</span></div>' +
      '<div class="items">' + list(econ, {firstOpen:true}) + '</div>';
  }

  // 特刊：status 为 "pending" 时只挂占位，正文等特刊任务跑完由 merge_special.py 补进来
  var spd = data.special;
  var spPending = !!(spd && spd.status === 'pending');
  var spReady   = !!(spd && spd.html && !spPending);
  if(spPending || spReady){
    var sp = document.getElementById('special-section');
    sp.hidden = false;
    sp.classList.toggle('pending', spPending);
    sp.open = spReady;                    // 占位没正文可读，默认收起
    document.getElementById('special-kicker').textContent = spPending ? '筹备中' : '特刊';
    document.getElementById('special-title').textContent = spd.title || '今日特刊';
    document.getElementById('special-body').innerHTML = spReady
      ? spd.html
      : '<p class="pending-note">本期特刊仍在筹备中，稍后会更新到本页。</p>';
    if(spReady) ban++;                    // 占位不计入版数
  }

  // 趣闻 / 笑话
  var fun = sec.local_fun || [], jokes = sec.jokes || [];
  if(fun.length) ban++;
  if(jokes.length) ban++;
  document.getElementById('local-fun-section').innerHTML = list(fun, {firstOpen:true});
  document.getElementById('jokes-section').innerHTML = list(jokes, {});

  // 假期带：数据由 special_helper.py 从 holidays.json 算好写进来
  var hol = Array.isArray(data.holidays) ? data.holidays : [];
  if(hol.length){
    var hb = document.getElementById('holiday-bar');
    hb.hidden = false;
    hb.innerHTML = hol.map(function(h){
      var md = h.date ? h.date.slice(5).replace('-', '/') : '';
      var when = h.days === 0 ? '就是今天'
               : h.days === 1 ? '明天'
               : '还有 ' + h.days + ' 天';
      return '<span class="hol hol-' + esc(h.region || '') + '"><b>' + esc(h.label) + '</b>' +
        '<span class="hol-name">' + esc(h.name) + '</span>' +
        (h.scope ? '<span class="hol-scope">' + esc(h.scope) + '</span>' : '') +
        '<i>' + esc(md) + '</i><em>' + when + '</em></span>';
    }).join('');
  }

  // 报头信息
  document.getElementById('date-line').textContent =
    (data.date || '') + (data.weekday ? ' · ' + data.weekday : '') + (data.lunar ? ' · ' + data.lunar : '');
  document.getElementById('issue-no').textContent = data.issue_no != null ? data.issue_no : '--';
  document.getElementById('ban-count').textContent = ban || 1;
  // 报尾：诗词赏析。没有 poem 时退回旧的 quote 字段，老数据不会开天窗
  var poem = data.poem;
  if(poem && (poem.title || poem.lines)){
    document.getElementById('poem-block').hidden = false;
    document.getElementById('poem-title').textContent = poem.title || '';
    document.getElementById('poem-by').textContent =
      [poem.dynasty, poem.author].filter(Boolean).join(' · ');
    var pl = Array.isArray(poem.lines) ? poem.lines : (poem.lines ? [poem.lines] : []);
    document.getElementById('poem-lines').innerHTML = pl.map(esc).join('<br>');
    var noteEl = document.getElementById('poem-note');
    noteEl.textContent = poem.note || '';
    if(!poem.note) noteEl.hidden = true;
  } else {
    document.getElementById('quote-line').textContent = data.quote ? ('“' + data.quote + '”') : '';
  }

  // 索引：只显示真有内容的板块
  [['sec-china',(sec.china||[]).length],['sec-us_ca',(sec.us_ca||[]).length],
   ['sec-global',(sec.global||[]).length],['economy-section',econ.length],
   ['special-section',(spPending||spReady)?1:0],
   ['sec-local',fun.length],['sec-jokes',jokes.length]].forEach(function(p){
    var btn = document.querySelector('.jump[data-target="' + p[0] + '"]');
    if(btn && p[1]) btn.hidden = false;
  });
  document.querySelectorAll('.jump').forEach(function(btn){
    btn.addEventListener('click', function(){
      var t = document.getElementById(btn.dataset.target);
      if(t) t.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });

  // 展开 / 收起全部
  var allBtn = document.getElementById('toggle-all');
  allBtn.addEventListener('click', function(){
    var items = document.querySelectorAll('details.item');
    var expand = allBtn.textContent === '展开全部';
    items.forEach(function(d){ d.open = expand; });
    allBtn.textContent = expand ? '收起全部' : '展开全部';
  });

  // 日间 / 夜间：记住选择，读不到就跟随系统
  var root = document.documentElement, themeBtn = document.getElementById('toggle-theme');
  function paint(){
    var night = root.dataset.theme
      ? root.dataset.theme === 'night'
      : matchMedia('(prefers-color-scheme:dark)').matches;
    themeBtn.textContent = night ? '日间' : '夜间';
  }
  try{ var saved = localStorage.getItem('xxhh-theme'); if(saved) root.dataset.theme = saved; }catch(e){}
  paint();
  themeBtn.addEventListener('click', function(){
    var night = root.dataset.theme
      ? root.dataset.theme === 'night'
      : matchMedia('(prefers-color-scheme:dark)').matches;
    root.dataset.theme = night ? 'day' : 'night';
    try{ localStorage.setItem('xxhh-theme', root.dataset.theme); }catch(e){}
    paint();
  });

  document.getElementById('do-print').addEventListener('click', function(){ window.print(); });

  // 阅读进度
  var bar = document.getElementById('progress');
  var navEl = document.querySelector('.indexbar');
  function tick(){
    var h = document.documentElement.scrollHeight - innerHeight;
    bar.style.width = (h > 0 ? (scrollY / h) * 100 : 0) + '%';
    if(navEl) navEl.classList.toggle('stuck', navEl.getBoundingClientRect().top <= 0.5);
  }
  addEventListener('scroll', tick, {passive:true});
  addEventListener('resize', tick);
  tick();
})();
</script>
